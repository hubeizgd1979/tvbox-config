name = "tvbox-aggregator"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 创建 KV：npx wrangler kv namespace create KV
# 把返回的 id 填到下面
[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id"

# 自定义域名（需在 Cloudflare 托管域名下）。取消注释并填写：
# [[routes]]
# pattern = "tvbox.yourdomain.com"
# custom_domain = true

[observability]
enabled = true
